<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INAVET</title>
    <script>
      (function () {
        var path = location.pathname + location.search + location.hash;
        var base = location.hostname.endsWith('.github.io') ? '/Proyecto-INAVET/' : '/';
        if (location.pathname === base || location.pathname === base + 'index.html') return;
        try {
          sessionStorage.setItem('inavet:return-path', path);
          sessionStorage.removeItem('redirect');
          location.replace(base);
        } catch (error) {
          // Leave the home link available if storage is disabled.
        }
      })();
    </script>
  </head>
  <body>
    <p>Abriendo INAVET… <a href="/">Ir al inicio</a></p>
  </body>
</html>
