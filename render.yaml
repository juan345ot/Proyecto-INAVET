services:
  # ─── Backend: Express + MongoDB ──────────────────────────────────────────────
  - type: web
    name: inavet-api
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false   # Lo configurás manualmente en el panel de Render
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false

  # ─── Frontend: Vite + React ───────────────────────────────────────────────────
  - type: web
    name: inavet-frontend
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # Lo configurás con la URL del backend inavet-api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
